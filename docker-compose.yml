services:
  postgres:
    image: postgres:17
    container_name: salesai-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: salesai
      POSTGRES_PASSWORD: salesai
      POSTGRES_DB: salesai
    volumes:
      - salesai_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salesai -d salesai"]
      interval: 5s
      timeout: 5s
      retries: 10

  searxng:
    image: searxng/searxng
    container_name: salesai-searxng
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./services/searxng:/etc/searxng:ro

  crawl4ai:
    image: unclecode/crawl4ai:latest
    container_name: salesai-crawl4ai
    restart: unless-stopped
    ports:
      - "11235:11235"
    shm_size: 1g
    environment:
      CRAWL4AI_API_TOKEN: ${CRAWL4AI_API_TOKEN:-}

volumes:
  salesai_postgres_data:
